name: Build APK Ultimate

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev mpfr-dev libmpc-dev lld
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Build Android Debug APK
        run: buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: vppbasic-apk
          path: bin/*.apk
          
