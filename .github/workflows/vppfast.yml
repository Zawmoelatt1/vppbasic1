name: Build APK Fast

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev libmpfr-dev libmpc-dev lld

      - name: Install Buildozer Tool
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer
          yes | buildozer android p4a --accept_sdk_license || true
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Run Buildozer Engine
        run: buildozer android debug --quiet
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: vppfast-apk
          path: bin/*.apk
          
