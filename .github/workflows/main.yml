name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # === အဆင့် ၁ - Java environment ကို အရင်ပြင်ဆင်ပါ ===
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # === အဆင့် ၂ - Android SDK ကို သီးသန့်တင်ပြီး License တွေကို ရိုက်ထည့်ပေးလိုက်ပါ ===
    - name: Accept Android SDK Licenses
      run: |
        sudo mkdir -p /usr/lib/android-sdk/licenses
        yes | sudo sdkmanager --licenses || true

    # === အဆင့် ၃ - ပြီးမှ Buildozer နဲ့ Build ပါ ===
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer_version: stable
        args: android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
defaults:
 
