name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # === အဆင့် ၁ - Buildozer အတွက် လိုအပ်တဲ့ Dependencies တွေကို အရင်သွင်းပေးပါ ===
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential ccache git libffi-dev libssl-dev \
          python3-dev python3-pip python3-setuptools unzip zip

    # === အဆင့် ၂ - Buildozer Action ကို run တဲ့အခါ auto-accept settings တွေ ထည့်ပေးလိုက်ပါ ===
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      env:
        # Buildozer ရဲ့ အောက်က python-for-android အတွက် license လက်ခံခိုင်းခြင်း
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        # စက်ထဲက သတ်မှတ်ချက်တွေအတွက်ပါ သေချာအောင် ထည့်ပေးခြင်း
        ACCEPT_SDK_LICENSE: "y"
        ANDROID_LOGTOSTDERR: "1"
      with:
        buildozer_version: stable
        args: android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
        
